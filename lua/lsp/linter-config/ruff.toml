line-length = 100 # black é 88
indent-width = 4
# exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
# ╭──────────────────────────────────────────────────────────╮
# │                          format                          │
# ╰──────────────────────────────────────────────────────────╯
format.quote-style = "double"  # double quotes for strings.
format.line-ending = "auto"  # automatically detect the appropriate line ending.
format.skip-magic-trailing-comma = false  # respect magic trailing commas.
# ╭──────────────────────────────────────────────────────────╮
# │                           lint                           │
# ╰──────────────────────────────────────────────────────────╯
# enable pyflakes (`f`) and a subset of the pycodestyle (`e`)  codes by default.
lint.select = [ "all" ]  # ["e", "f"]
lint.ignore = [
  "a001",    # variable `dir` is shadowing a python builtin
  "a002",    # function argument `input` is shadowing a python builtin
  # "td002",   # missing author in todo;
  "ann001",  # missing type annotation for function argument
  "ann201",  # missing return type annotation
  "ann202",  # missing return type annotation for private function
  "ann204",  # missing return type annotation for special method `__init__`
  "ann205",  # missing return type annotation for staticmethod
  "ann401",  # dynamically typed expressions (typing.any) are disallowed in `f`
  "b006",    # do not use mutable data structures for argument defaults
  "b023",    # function definition does not bind loop variable
  "b904",    # within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from none` to distinguish them from errors in exception handling
  "ble001",  # do not catch blind exception
  "com812",  # trailing comma missing
  "d100",    # missing docstring in public module 1:1:1 ruff d100
  "d101",    # missing docstring in public class
  "d102",    # missing docstring in public method
  "d103",    # missing docstring in public function
  "d105",    # missing docstring in magic method
  "d107",    # missing docstring in `__init__`
  "d202",    # no blank lines allowed after function docstring
  "d212",    # multi-line docstring summary should start at the first line 35:5:74 ruff
  "d401",    # first line of docstring should be in imperative mood:
  "d413",    # missing blank line after last section ("returns")
  "d415",    # first line should end with a period, question mark, or exclamation point
  "dtz",     # smells de date time
  "e501",    # `e501` (line length violations).
  "e731",    # rewrite lambda as def
  "e741",    # (do not use variables named 'i', 'o', or 'l').
  "em101",   # exception must not use a string literal, assign to variable first
  "em102",   # exception must not use an f-string literal, assign to variable first
  "era001",  # found commented-out code
  "exe002",  # the file is executable but no shebang is present
  "fa100",   # add `from __future__ import annotations` to simplify `typing.optional`
  "fbt001",  # boolean-typed positional argument in function definition
  "fbt002",  # boolean default positional argument in function definition
  "fix002",  # line contains todo, consider resolving the issue
  "g004",    # logging statement uses f-string
  "i001",    # import block is un-sorted or un-formatted
  "inp001",  # file `foo.py` is part of an implicit namespace package. add an `__init__.py`
  "n806",    # variable `variable` in function should be lowercase,
  "perf401", # use `list.extend` to create a transformed list
  "plc0207", # string is split more times than necessary
  "plr0911", # too many return statements (max 6)
  "plr2004", # magic value used in comparison
  "plw2901", # `for` loop variable `overwritten by assignment target
  "pth123",  # `open()` should be replaced by `path.open()`
  "ret502",  # do not implicitly `return none` in function able to return non-`none` value
  "ret503",  # missing explicit `return` at the end of function able to return non-`none` value
  "ret504",  # unnecessary assignment  before `return` statement
  "s",
  "sim102",  # use a single `if` statement instead of nested `if` statements
  "sim103",  # return the condition `bool(has_same_prefix)` directly
  "sim113",  # use `enumerate()` for index variable `foo` in `for` loop
  "t201",    # print found
  "tc001",   # move import into a type-checking block
  "tc003",   # move standard library import foo into a type-checking block
  "td",      # negócio de todo
  "td006",   # line contains todo, consider resolving the issue
  "tid252",  # prefer absolute imports over relative imports from parent modules
  "try003",  # avoid specifying long messages outside the exception class
  "try300",  # consider moving statement to else block — equivalente a código após o bloco quando except desvia
  # "td003",   # missing issue link on the line following this todo
  # "s101",    # use of `assert` detected
]
# allow fix for all enabled rules (when `--fix`) is provided.
lint.fixable = [ "all" ]
lint.unfixable = []
# allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-za-z0-9_]*[a-za-z0-9]+?))$"

[tool.ruff.lint.flake8-type-checking]
# pydantic resolve anotações em runtime via model_rebuild(); sem isso, tc002
# moveria imports de campos para type_checking e quebraria a validação.
runtime-evaluated-base-classes = ["pydantic.basemodel"]

